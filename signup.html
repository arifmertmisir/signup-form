<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <main>
        <section>
            <div class="image_container">
                <img src="assets/anna-zaro-XNdOjApFA04-unsplash.jpg" alt="background image plant">
                <p>Photo by Anna Zaro on Unsplash</p>
            </div>
        </section>
        <section>
            <div class="header">
                This is not a real online service! You know you need something like this in your life
                to help you realize your deepest dreams.
                <br>
                Signup <span style="font-style: italic;">now</span> to get started.
                <br>
                <br>
                You <span style="font-style: italic;">know</span> you want to.
            </div>
        </section>
        <section>
            <div class="form_container">
                <form action="#">
                    <legend>Let's do this!</legend>
                    <div class="first_column_user_details">
                        <label for="first_name">First Name</label>
                        <input type="text" id="first_name" name="first_name">
                
                        <label for="email">Email</label>
                        <input type="email" id="email" name="email">
                
                        <label for="password">Password</label>
                        <input type="password" id="password" name="password">
                    </div>
                    <div class="second_column_user_details">
                        <label for="last_name">Last Name</label>
                        <input type="text" id="last_name" name="last_name">

                        <label for="phone">Phone Number</label>
                        <input type="text" id="phone" name="phone">

                        <label for="confirm_password">Confirm Password</label>
                        <input type="password" id="confirm_password" name="confirm_password">
                    </div>
                </form>
            </div>
        </section>
        <section>
            <div class="button_container">
                <button type="submit">Create Account</button>
                <p>Already have an account ? <span style="color: #596D48; font-weight: bold;">Log in</span></p>
            </div>
        </section>
    </main>
</body>
</html>
