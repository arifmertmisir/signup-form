<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <main>
        <section>
            <div class="image_container">
                <img src="assets/anna-zaro-XNdOjApFA04-unsplash.jpg" alt="background image plant">
                <p>Photo by Anna Zaro on Unsplash</p>
            </div>
        </section>
        <section>
            <div class="header">
                <p>
                    This is not a real online service! You know you need something like this in your life
                    to help you realize your deepest dreams.
                    <br>
                    Signup <span>now</span> to get started.
                    <br>
                    <br>
                    You <span>know</span> you want to.
                </p>
            </div>
        </section>
        <section>
            <div class="form_container">
                <form id="signup_form" action="#">
                    <h3>Let's do this!</h3>
                    <div class="first_column_user_details">
                        <label for="first_name">First Name</label>
                        <input type="text" id="first_name" name="first_name" minlength="3">
                
                        <label for="email">Email</label>
                        <input type="email" id="email" name="email" >
                
                        <label for="password">Password</label>
                        <input type="password" id="password" name="password" minlength="8" required >
                    </div>
                    <div class="second_column_user_details">
                        <label for="last_name">Last Name</label>
                        <input type="text" id="last_name" name="last_name" minlength="3">

                        <label for="phone">Phone Number</label>
                        <input type="tel" id="phone" name="phone">

                        <label for="confirm_password">Confirm Password</label>
                        <input type="password" id="confirm_password" name="confirm_password" minlength="8" required>
                    </div>
                </form>
            </div> 
        </section>
        <section>
            <div class="button_container">
                <button type="submit" form="signup_form">Create Account</button>
                <p>Already have an account ? <a href="#">Log in</a></p>
            </div>
        </section>
    </main>
</body>
</html>
